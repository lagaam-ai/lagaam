name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q
        env:
          # Runners take ~3.5x a laptop's time; the scaled bounds still catch the quadratic blowups.
          LAGAAM_TEST_SLOWDOWN: "4"
      - run: uv run mypy
