[project]
name = "lagaam"
version = "0.2.3"
description = "Lagaam — governed MCP analytics server for the open lakehouse"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mudit Kapoor", email = "muditk441@gmail.com" }]
keywords = ["mcp", "trino", "pinot", "llm", "agents", "sql", "lakehouse", "cost-guard"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    # v2.0 renames FastMCP -> MCPServer and breaks the import path; migrate deliberately.
    "mcp>=1.28,<2",
    # 2.11+ for ConfigDict(serialize_by_alias) — older pydantic ignores it silently.
    "pydantic>=2.11",
    "sqlglot>=30,<31",
    # The Pinot adapter's only transport: one POST and one JSON response.
    "httpx>=0.27",
    # httpx bounds each operation; anyio bounds the whole broker call.
    "anyio>=4",
    "trino>=0.330",
]

[project.scripts]
lagaam = "lagaam.__main__:main"

[project.urls]
Homepage = "https://github.com/lagaam-ai/lagaam"
Repository = "https://github.com/lagaam-ai/lagaam"
Issues = "https://github.com/lagaam-ai/lagaam/issues"
Changelog = "https://github.com/lagaam-ai/lagaam/releases"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "mypy>=1.13",
]

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lagaam"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs a running engine (docker compose --profile trino|pinot up)",
]
# The suite runs in under a second; a test past this is hung, not slow. The
# guards here bound work sqlglot does not, so a regression means an infinite
# spin, and without a timeout it takes the machine rather than the build.
timeout = 60
addopts = "-m 'not integration'"

[tool.mypy]
strict = true
packages = ["lagaam.core", "lagaam.adapters.pinot"]
