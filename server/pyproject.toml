[project]
name = "lagaam-server"
version = "0.1.0"
description = "Lagaam — governed MCP analytics server for the open lakehouse"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    # v2.0 renames FastMCP -> MCPServer and breaks the import path; migrate deliberately.
    "mcp>=1.28,<2",
    # 2.11+ for ConfigDict(serialize_by_alias) — older pydantic ignores it silently.
    "pydantic>=2.11",
    "sqlglot>=30,<31",
    "trino>=0.330",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "mypy>=1.13",
]

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lagaam"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs a running engine (docker compose --profile trino up)",
]
# The suite runs in under a second; a test past this is hung, not slow. The
# guards here bound work sqlglot does not, so a regression means an infinite
# spin, and without a timeout it takes the machine rather than the build.
timeout = 60
addopts = "-m 'not integration'"

[tool.mypy]
strict = true
packages = ["lagaam.core"]
